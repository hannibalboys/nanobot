[project]
name = "nanobot-connector"
version = "0.1.0"
description = "Local file connector for nanobot — exposes an allow-listed, read-only slice of your computer's filesystem to a nanobot server over an outbound WebSocket."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "the nanobot contributors" }]
keywords = ["nanobot", "connector", "agent"]

dependencies = [
    "websockets>=16.0,<17.0",
    "pydantic>=2.12.0,<3.0.0",
    "typer>=0.20.0,<1.0.0",
    "keyring>=25.0.0,<26.0.0",
    # MCP client for the local MCP proxy bridge (add-connector-mcp-proxy). Only
    # exercised when the owner registers local MCP servers; imported lazily.
    "mcp>=1.26.0,<2.0.0",
]

[project.optional-dependencies]
service = [
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
nanobot-connector = "nanobot_connector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanobot_connector"]

[tool.hatch.build]
include = ["nanobot_connector/**/*.py", "nanobot_connector/templates/**/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
