name: build-connector

# Builds single-file connector executables for Windows, macOS, and Linux and
# attaches them to a GitHub Release. Windows/macOS signing steps are placeholders
# — fill in secrets (WINDOWS_CERT / MACOS_CERT) to enable code signing.

on:
  push:
    tags:
      - "connector-v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Lint
        run: ruff check nanobot_connector

      - name: Build single-file executable
        run: pyinstaller packaging/nanobot-connector.spec

      # - name: Sign (Windows)
      #   if: runner.os == 'Windows'
      #   run: signtool sign /f cert.pfx /p ${{ secrets.WINDOWS_CERT_PASSWORD }} dist/nanobot-connector.exe

      # - name: Sign (macOS)
      #   if: runner.os == 'macOS'
      #   run: codesign --sign "${{ secrets.MACOS_CERT }}" dist/nanobot-connector

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanobot-connector-${{ matrix.os }}
          path: connector/dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: connector/dist/*
