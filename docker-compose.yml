x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
  volumes:
    - ~/.nanobot:/home/nanobot/.nanobot
  cap_drop:
    - ALL
  # Entrypoint uses these to fix bind-mount ownership and drop to the nanobot user.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    image: registry.cn-shanghai.aliyuncs.com/nanobot/gateway:latest
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    image: registry.cn-shanghai.aliyuncs.com/nanobot/api:latest
    <<: *common-config
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
        NANOBOT_EXTRAS: api
    command: ["serve", "--host", "0.0.0.0"]
    restart: unless-stopped
    ports:
      - 8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    # 同 gateway 镜像（构建参数一致），服务器上 pull 即可用，无需本地构建
    image: registry.cn-shanghai.aliyuncs.com/nanobot/gateway:latest
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
